{% extends "base.html" %}

{% block conteudo %}
<h1>Academia</h1>

{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}

<form class="login" action="/login" method="POST">

    <label>Usuário:</label>
    <input type="text" name="login" value="{{ login_digitado }}" required>

    <label>Senha:</label>
    <input type="password" name="senha" required>

    <button type="submit">Entrar</button>
</form>
{% endblock %}
