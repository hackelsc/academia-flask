{% extends "base.html" %}

{% block conteudo %}
<h1>Excluir pagamento</h1>

<p>Tem certeza que deseja excluir este pagamento? Esta ação não pode ser desfeita.</p>

<p>
    Aluno: {{ nome }}<br>
    Mês de referência: {{ mes_referencia }}<br>
    Valor: R$ {{ "%.2f"|format(valor) }}<br>
    Forma: {{ forma_pagamento }}
</p>

<form action="/alunos/{{ id }}/pagamentos/{{ pagamento_id }}/excluir" method="POST">
    <button type="submit">Sim, excluir</button>
    <a href="/alunos/{{ id }}/pagamentos">Cancelar</a>
</form>
{% endblock %}
